---
name: "Deploy Obsidian"
on:
  push:
    branches:
      - '**'
    paths:
      - ".github/workflows/obsidian.yaml"
      - "nix/flakes/default.nix"
      - "nix/flakes/packages.nix"
      - "packages/obsidian/**"
  pull_request:
    branches:
      - '**'
    paths:
      - ".github/workflows/obsidian.yaml"
      - "nix/flakes/default.nix"
      - "nix/flakes/packages.nix"
      - "packages/obsidian/**"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: obsidian-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0
      - name: Build Obsidian
        run: nix build .#obsidian
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: ./.github/actions/deploy-cloudflare-pages
        with:
          directory: result
          project-name: obsidian-momee-mt
          domain: obsidian.momee.mt
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/comment-preview-url
        with:
          preview-name: "Obsidian"
          deployment-url: ${{ steps.deploy.outputs.deployment_url }}
          deploy-branch: ${{ steps.deploy.outputs.deploy_branch }}
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          commit-sha: ${{ github.sha }}
