---
name: "Deploy Obsidian"
on:
  push:
    branches:
      - '**'
    paths:
      - ".github/workflows/obsidian.yaml"
      - "nix/flakes/devShells.nix"
      - "packages/obsidian/**"
  pull_request:
    branches:
      - '**'
    paths:
      - ".github/workflows/obsidian.yaml"
      - "nix/flakes/devShells.nix"
      - "packages/obsidian/**"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: obsidian-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@b3e3f405539b332fcb96794525f35fb10c230baa # v3.13.2
      - name: Build Quartz
        run: |
          nix develop .#obsidian --command bash <<'EOF'
          set -euo pipefail

          quartz_dir="${RUNNER_TEMP}/quartz"
          rm -rf "${quartz_dir}"
          git clone --depth 1 --branch v4 https://github.com/jackyzha0/quartz.git "${quartz_dir}"

          rm -rf "${quartz_dir}/content"
          mkdir -p "${quartz_dir}/content"
          rsync -a --delete \
            --exclude ".obsidian/" \
            --exclude ".quartz/" \
            --exclude "node_modules/" \
            --exclude "public/" \
            --exclude "package-lock.json" \
            --exclude "package.json" \
            "packages/obsidian/" \
            "${quartz_dir}/content/"

          cp "packages/obsidian/.quartz/quartz.config.ts" "${quartz_dir}/quartz.config.ts"
          cp "packages/obsidian/.quartz/quartz.layout.ts" "${quartz_dir}/quartz.layout.ts"

          cd "${quartz_dir}"
          npm ci
          npx quartz build --directory content --output public
          EOF
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |-
          nix develop .#obsidian --command bash <<'EOF'
          set -euo pipefail

          deploy_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          deploy_log="${RUNNER_TEMP}/wrangler-pages-deploy.log"

          npx --yes wrangler@4 pages deploy "${RUNNER_TEMP}/quartz/public" \
            --project-name obsidian-momee-mt \
            --branch "${deploy_branch}" \
            2>&1 | tee "${deploy_log}"

          deployment_url="$(
            grep -Eo 'https://[^[:space:]]+' "${deploy_log}" \
              | grep -E 'pages\.dev|obsidian\.momee\.mt' \
              | tail -n 1 \
              || true
          )"
          if [ -z "${deployment_url}" ]; then
            echo "Failed to extract Cloudflare Pages deployment URL." >&2
            exit 1
          fi

          {
            echo "deploy_branch=${deploy_branch}"
            echo "deployment_url=${deployment_url}"
          } >> "${GITHUB_OUTPUT}"
          EOF
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        env:
          DEPLOY_BRANCH: ${{ steps.deploy.outputs.deploy_branch }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |-
          set -euo pipefail

          marker="<!-- obsidian-pages-preview -->"
          body="$(
            cat <<EOF
          ${marker}
          Obsidian preview deployed: ${DEPLOYMENT_URL}

          - Branch: \`${DEPLOY_BRANCH}\`
          - Commit: \`${GITHUB_SHA}\`
          EOF
          )"

          comment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- obsidian-pages-preview -->"))) | .id' \
              | tail -n 1
          )"

          if [ -n "${comment_id}" ]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f "body=${body}" > /dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f "body=${body}" > /dev/null
          fi
