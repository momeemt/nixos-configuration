---
name: "CI"
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
jobs:
  flake-check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Setup Attic cache
        if: >-
          github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ secrets.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
      - run: nix flake check --all-systems
  nix-build:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: nixosConfigurations.emu.config.system.build.toplevel
            os: ubuntu-24.04
          - target: nixosConfigurations.shime.config.system.build.toplevel
            os: ubuntu-24.04
          - target: darwinConfigurations.uguisu.system
            os: macos-15
          - target: homeConfigurations.example.activationPackage
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Setup Attic cache
        if: >-
          github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ secrets.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-push: true
      - name: Setup age key
        run: |
          sudo mkdir -p /var/lib/sops-nix
          echo "$SOPS_AGE_KEY" | sudo tee /var/lib/sops-nix/key.txt > /dev/null
          sudo chmod 600 /var/lib/sops-nix/key.txt
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Build target
        run: |
          set -o pipefail
          nix build .#${{ matrix.target }} --no-link --print-build-logs --print-out-paths \
            | tee "$RUNNER_TEMP/nix-build-out-paths"
      - name: Push build outputs to Attic
        if: >-
          success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        timeout-minutes: 10
        env:
          ATTIC_CACHE: ${{ secrets.ATTIC_CACHE }}
        run: |
          set -o pipefail
          while IFS= read -r out; do
            nix path-info --recursive "$out"
          done < "$RUNNER_TEMP/nix-build-out-paths" | attic push --stdin "$ATTIC_CACHE"
      - name: Cleanup secrets
        if: always()
        run: |
          sudo rm -rf /var/lib/sops-nix
          rm -rf ~/.config/sops/age
          sudo rm -rf /run/secrets* /run/user/*/secrets* 2>/dev/null || true
  container-build:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: false
