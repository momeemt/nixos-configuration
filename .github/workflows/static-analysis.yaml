name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  nix-formatting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Verify Nix flakes is enabled
        run: nix --version && nix --extra-experimental-features '' flake --version

      - name: Install alejandra
        run: nix profile install nixpkgs#alejandra

      - name: Check Nix formatting
        run: alejandra --check --exclude secrets .

  nix-dead-code:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install deadnix
        run: nix profile install nixpkgs#deadnix

      - name: Check for dead Nix code
        run: deadnix --fail --exclude secrets .

  nix-linting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install statix
        run: nix profile install nixpkgs#statix

      - name: Lint Nix files
        run: statix check --ignore secrets .

  shell-linting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install shellcheck
        run: nix profile install nixpkgs#shellcheck

      - name: Check shell scripts
        run: |
          find . -type f \( -name "*.sh" -o -name "*.bash" -o -name "*.zsh" \) \
            ! -path "*/.*" ! -path "*/secrets/*" \
            -exec shellcheck {} +

  shell-formatting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install shfmt
        run: nix profile install nixpkgs#shfmt

      - name: Check shell script formatting
        run: |
          find . -type f \( -name "*.sh" -o -name "*.bash" -o -name "*.zsh" \) \
            ! -path "*/.*" ! -path "*/secrets/*" \
            -exec shfmt -d -i 2 -ci -bn {} +

  python-formatting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install black
        run: nix profile install nixpkgs#python312Packages.black

      - name: Check Python formatting
        run: |
          find . -type f -name "*.py" ! -path "*/.*" ! -path "*/secrets/*" \
            -exec black --check --diff {} +

  python-linting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install ruff
        run: nix profile install nixpkgs#ruff

      - name: Lint Python files
        run: |
          find . -type f -name "*.py" ! -path "*/.*" ! -path "*/secrets/*" \
            -exec ruff check {} +

  actions-linting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install actionlint
        run: nix profile install nixpkgs#actionlint

      - name: Lint GitHub Actions workflows
        run: actionlint

  markdown-formatting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install mdformat
        run: nix profile install nixpkgs#mdformat

      - name: Check Markdown formatting
        run: |
          find . -type f -name "*.md" ! -path "*/.*" ! -path "*/secrets/*" \
            -exec mdformat --check {} +

  yaml-formatting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install yamlfmt
        run: nix profile install nixpkgs#yamlfmt

      - name: Check YAML formatting
        run: |
          find . -type f \( -name "*.yaml" -o -name "*.yml" \) ! -path "*/.*" ! -path "*/secrets/*" \
            -exec yamlfmt -lint {} +
