---
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Tokyo"
    target-branch: "develop"
  - package-ecosystem: "docker"
    directory: ".devcontainer"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Tokyo"
    target-branch: "develop"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Tokyo"
    target-branch: "develop"
  - package-ecosystem: "terraform"
    directory: "terraform"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Tokyo"
    target-branch: "develop"
