<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      background: #2d2d2d;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      color: white;
      flex-shrink: 0;
    }
    .toolbar a {
      color: #7cb3f5;
      text-decoration: none;
    }
    .toolbar a:hover { text-decoration: underline; }
    .nav-btn {
      background: #404040;
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    .nav-btn:hover { background: #505050; }
    .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .page-info { min-width: 100px; text-align: center; }
    .spacer { flex: 1; }
    .download-btn {
      background: #4a7c4e;
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .download-btn:hover { background: #5a8c5e; }
    .viewer-container {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      padding: 1rem;
    }
    #pdf-canvas {
      max-width: 100%;
      height: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .loading {
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="/">← Back to list</a>
    <div class="spacer"></div>
    <button class="nav-btn" id="prev-btn">◀ Prev</button>
    <span class="page-info"><span id="page-num">1</span> / <span id="page-count">-</span></span>
    <button class="nav-btn" id="next-btn">Next ▶</button>
    <div class="spacer"></div>
    <a class="download-btn" id="download-btn" download>Download PDF</a>
  </div>
  <div class="viewer-container">
    <canvas id="pdf-canvas"></canvas>
  </div>
  <script type="module">
    const pdfjsLib = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

    const params = new URLSearchParams(location.search);
    const pdfFile = params.get('pdf');
    if (!pdfFile) {
      document.querySelector('.viewer-container').innerHTML = '<div class="loading">No PDF specified</div>';
      throw new Error('No PDF');
    }

    document.title = pdfFile.replace('.pdf', '') + ' - Slide Viewer';
    document.getElementById('download-btn').href = '/' + pdfFile;

    let pdfDoc = null, pageNum = 1, rendering = false, pageNumPending = null;
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');

    async function renderPage(num) {
      rendering = true;
      const page = await pdfDoc.getPage(num);
      const baseScale = 2;
      const viewport = page.getViewport({ scale: baseScale });
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      await page.render({ canvasContext: ctx, viewport }).promise;
      rendering = false;
      document.getElementById('page-num').textContent = num;
      document.getElementById('prev-btn').disabled = num <= 1;
      document.getElementById('next-btn').disabled = num >= pdfDoc.numPages;
      if (pageNumPending !== null) {
        renderPage(pageNumPending);
        pageNumPending = null;
      }
    }

    function queueRenderPage(num) {
      if (rendering) pageNumPending = num;
      else renderPage(num);
    }

    document.getElementById('prev-btn').onclick = () => { if (pageNum > 1) queueRenderPage(--pageNum); };
    document.getElementById('next-btn').onclick = () => { if (pageNum < pdfDoc.numPages) queueRenderPage(++pageNum); };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { if (pageNum > 1) queueRenderPage(--pageNum); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { if (pageNum < pdfDoc.numPages) queueRenderPage(++pageNum); }
    });

    pdfDoc = await pdfjsLib.getDocument({
      url: '/' + pdfFile,
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/cmaps/',
      cMapPacked: true,
      standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/standard_fonts/',
    }).promise;
    document.getElementById('page-count').textContent = pdfDoc.numPages;
    renderPage(pageNum);
  </script>
</body>
</html>
