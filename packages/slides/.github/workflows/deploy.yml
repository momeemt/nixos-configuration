name: Build and Deploy Slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Build slides and thumbnails
        run: |
          mkdir -p dist/thumbnails
          for dir in public/*/; do
            if [ -f "${dir}main.typ" ]; then
              name=$(basename "$dir")
              echo "Building $name..."
              typst compile "${dir}main.typ" "dist/${name}.pdf" --root .
              typst compile "${dir}main.typ" "dist/thumbnails/${name}.png" --root . --format png --pages 1
            fi
          done

      - name: Copy web assets
        run: cp web/viewer.html dist/

      - name: Generate index page
        run: bash web/generate-index.sh dist

      - name: Create CNAME for custom domain
        run: echo "slides.momee.mt" > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
