apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-k8s
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/momeemt/config.git
    targetRevision: develop
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
